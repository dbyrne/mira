# Curated bright-galaxy catalog for the ZWO Seestar S30 Pro (30mm f/5,
# 150mm fl, IMX585 → ~4.2° × 2.4° FOV) from Jersey City (~40.7°N, Bortle 8-9).
# Consumed by `mira galaxies plan`. Distinct from sho_targets.yaml (narrowband
# emission targets, Esprit rig) and from the VSX variable-star queue.
#
# Selection philosophy — this is the whole point of the galaxy path:
#   Integrated magnitude tells you almost nothing about whether a galaxy is
#   imageable from a light-polluted backyard. SURFACE BRIGHTNESS does. A
#   mag-9 face-on spiral (M74, M101) spreads its light thin and drowns in
#   urban skyglow; a mag-10 edge-on (NGC 891, NGC 4565) concentrates it and
#   pops. So `magnitude` + `size_arcmin` here feed a derived mean surface
#   brightness (SB = m + 2.5·log₁₀(ellipse area in arcsec²)), and the
#   planner ranks on SB, not mag. Low-SB targets aren't removed — per the
#   "targets shouldn't disappear" rule they stay in the queue, flagged
#   "dark-site only" and demoted.
#
# Schema (shared loader with sho_targets.yaml):
#   name           — canonical identifier (M / NGC / IC)
#   common_name    — human-readable
#   object_type    — GALAXY (always, for this catalog)
#   ra_deg, dec_deg — J2000 decimal degrees
#   size_arcmin    — [major, minor] of the D25 isophote
#   magnitude      — integrated visual magnitude (the galaxy-specific field)
#   constellation  — IAU 3-letter
#   budget_minutes — {IR: minutes}. IR = the S30's IR-cut broadband filter,
#                    the slot galaxies are shot through per the galaxy
#                    doctrine (the slot named "LP" is the dual-band
#                    Ha+OIII filter, for emission targets only — and the
#                    ledger only books minutes against budgeted filter
#                    keys, so the key here MUST match the filter actually
#                    used). Keeping it broadband (no Ha/OIII/SII) means the
#                    planner applies the strict moon gate, which is correct
#                    for galaxies. Budgets scale with surface brightness:
#                    bright/high-SB ~120-180, medium ~240, faint low-SB
#                    ~300-360.
#   notes          — morphology + a capture tip
#
# Coordinates are J2000 from SIMBAD/NED, ~arcmin precision (plate-solve does
# the real centering). Sizes/mags are catalog-typical; tune to taste.
#
# Dec note: from JC the alt floor is 45°, which needs dec ≳ -4° to clear.
# A few famous southern showpieces (M104, NGC 253) are listed for catalog
# completeness / a future travel site; the planner drops them from a JC plan
# automatically (zero minutes above the floor) — they won't clutter output.

catalog_version: "2026-05-28"

defaults:
  gain: 80            # S30 Pro IMX585 HCG point (see memory: s30-pro-imx585-gain)
  exposure_s: 30      # 30s OSC subs in EQ mode — galaxies want depth + dither
  filter: IR          # the S30's IR-cut broadband — the galaxy doctrine slot (LP = dual-band, emission only)

