# Curated narrowband-friendly DSO catalog for the Esprit 120 EDX + ASI2600MM Pro
# rig from Jersey City (~40.7°N). FOV is ~1.6° × 1.07° (840mm focal length on
# an APS-C 23.5×15.7mm sensor). Targets are chosen to:
#   - Be observable from JC (dec >= -10°)
#   - Either fit a single frame, or be flagged as mosaic candidates
#   - Have meaningful narrowband signal (Ha/OIII/SII emission, or strong
#     broadband for reflection/dark nebulae included as L+RGB targets)
#
# Schema:
#   name           — canonical catalog identifier (NGC/IC/Sh2/M/Abell/...)
#   common_name    — human-readable
#   object_type    — HII | PN | SNR | WR | DARK | REF | OPEN | GLOB
#   ra_deg, dec_deg — J2000 in decimal degrees
#   size_arcmin    — [major, minor]
#   constellation  — IAU 3-letter abbreviation
#   budget_minutes — per-filter integration target. Keys are NINA wheel labels.
#                    Standard set: Ha, OIII, SII (narrowband), L, R, G, B (broad).
#   mosaic         — true if target exceeds the single-frame FOV (1.6°×1.07°)
#   notes          — anything notable for capture planning
#
# Coordinates are J2000 from SIMBAD/NED rounded to ~2 arcmin precision — good
# enough for plate-solve centering, the actual centering comes from
# `mira capture --platesolve-center`.

catalog_version: "2026-05-24"

defaults:
  gain: 100
  exposure_s: 300       # 5-min subs — standard narrowband with guided EQ
  filters_narrowband: [Ha, OIII, SII]
  filters_broadband: [L, R, G, B]

