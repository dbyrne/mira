# M51 Whirlpool Galaxy — session profile for `mira capture --session`.
#
# Multi-night project: keys off ra/dec for re-acquisition framing. Anchor
# coords are J2000 from SIMBAD. Use with:
#   mira capture --session targets/m51.yaml --dest data/captures/m51_<UTC>
#
# Any CLI flag overrides the value here. To skip plate-solve on a given
# night (e.g. clouds rolled in and you just want subs), pass
# `--no-platesolve-center` on the CLI.

ra: 202.4696
dec: 47.1952
# 60s exposure: originally validated 2026-05-19 via `mira tune` at gain
# 120 (HFR stable at ~2.0 px out to 90s; sky already 400x read noise at
# 30s — sky-limited). 60s carries over cleanly to gain 80: HCG mode has
# lower read noise so the sky-limit crossover is even shorter, and
# post-HCG amplification drops with gain so g80 has MORE well depth than
# g120 (less saturation risk on bright cores/stars). Re-run `mira tune
# --filter LP --gain 80` if you want an empirical confirmation.
exposure: 60
# Gain 80: IMX585 HCG sweet spot per Cloudy Nights community guidance.
# Going above 80 reduces dynamic range without further read-noise benefit.
# Flats matched: requires data/flats/LP_g80_<date>/master_flat.fit (run
# `mira flats --gain 80 --filters LP` if missing — mira stack --auto-flats
# will hard-abort otherwise).
gain: 80
filter: LP
target_name: M51
platesolve_center: true
# autofocus_every_min: omitted — S30 Pro has no motorized focuser, NINA's
# run_autofocus would just fail-soft and waste a slot every interval.
dither_arcsec: 30
